<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Святыни — Православный Мир</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .holiness-header { text-align: center; margin-bottom: 40px; }
        .holiness-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(32px, 4vw, 48px); font-weight: 700; color: var(--dark); line-height: 1.15; }
        .holiness-header h1 em { font-style: italic; color: var(--gold); }
        .holiness-header p { font-size: 16px; color: var(--text-muted); max-width: 600px; margin: 0 auto; line-height: 1.7; }

        .holiness-search {
            display: flex;
            align-items: center;
            background: var(--white);
            border-radius: var(--radius-md);
            padding: 4px 16px;
            box-shadow: var(--shadow-card);
            margin: 0 auto 24px auto;
            max-width: 500px;
            border: 1px solid var(--cream-2);
        }
        .holiness-search input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            padding: 12px 0;
            background: transparent;
            font-family: 'Inter', sans-serif;
        }
        .holiness-search input::placeholder {
            color: var(--text-muted);
        }
        .holiness-search .search-icon {
            font-size: 20px;
            margin-right: 10px;
            color: var(--text-muted);
        }

        .holiness-filters {
            display: flex; gap: 10px; flex-wrap: nowrap; overflow-x: auto;
            padding-bottom: 8px; margin-bottom: 32px; scrollbar-width: none;
        }
        .holiness-filters::-webkit-scrollbar { display: none; }
        .filter-btn {
            flex-shrink: 0; padding: 8px 20px; border-radius: 100px; border: 1px solid var(--cream-2);
            background: var(--white); font-size: 13px; color: var(--text-muted);
            cursor: pointer; transition: all var(--transition); font-family: 'Inter', sans-serif; white-space: nowrap;
        }
        .filter-btn:hover, .filter-btn.active { background: var(--dark); color: var(--gold-light); border-color: var(--dark); }

        .holiness-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }

        .holiness-card {
            background: var(--white);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            transition: transform var(--transition), box-shadow var(--transition);
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .holiness-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }

        .holiness-card-img {
            height: 200px; width: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 64px;
            background: linear-gradient(135deg, var(--dark-3), #1A3A2A);
        }
        .holiness-card:nth-child(2) .holiness-card-img { background: linear-gradient(135deg, #2C1E0A, #1A2A35); }
        .holiness-card:nth-child(3) .holiness-card-img { background: linear-gradient(135deg, #1A2A35, #2C1E0A); }
        .holiness-card:nth-child(4) .holiness-card-img { background: linear-gradient(135deg, #1E2C1A, #35280A); }
        .holiness-card:nth-child(5) .holiness-card-img { background: linear-gradient(135deg, #251A35, #1A3A2A); }

        .holiness-body { padding: 20px; }
        .holiness-tag {
            display: inline-block; background: var(--gold-pale); color: var(--dark-2);
            font-size: 11px; font-weight: 600; padding: 2px 12px; border-radius: 100px; text-transform: uppercase; margin-bottom: 8px;
        }
        .holiness-name {
            font-family: 'Playfair Display', serif;
            font-size: 20px; font-weight: 700; color: var(--dark);
            margin-bottom: 4px; line-height: 1.3;
        }
        .holiness-title {
            font-size: 13px; color: var(--gold); font-weight: 500; margin-bottom: 8px;
        }
        .holiness-desc {
            font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 12px;
        }

        .holiness-meta {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; color: var(--text-muted);
            border-top: 1px solid var(--cream-2); padding-top: 12px;
        }
        .holiness-feast { font-weight: 500; color: var(--gold); }
        .holiness-location { font-weight: 500; color: var(--gold); }
        .holiness-name-link { display: block; text-decoration: none; }
        .holiness-name-link:hover { color: var(--gold); }
        .holiness-verification { display: inline-flex; margin-top: 10px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .holiness-verification.verified, .entity-detail-badge.verified { background: #e8f6ec; color: #2d6b3f; }
        .holiness-verification.unverified, .entity-detail-badge.unverified { background: var(--gold-pale); color: var(--dark-2); }

        .entity-detail { margin: 0 auto 28px; max-width: 980px; background: var(--white); border: 1px solid var(--cream-2); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 24px; }
        .entity-detail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
        .entity-detail-copy { min-width: 0; }
        .entity-detail-side { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; flex-shrink: 0; }
        .entity-detail-type { color: var(--gold); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
        .entity-detail-name { margin: 4px 0; font-family: 'Playfair Display', serif; color: var(--dark); font-size: clamp(26px, 4vw, 38px); }
        .entity-detail-title, .entity-detail-location { color: var(--text-muted); font-size: 14px; line-height: 1.55; }
        .entity-detail-description { color: var(--text); line-height: 1.7; }
        .entity-detail-location { padding: 10px 12px; background: var(--cream); border-radius: 10px; }
        .entity-detail-badge { display: inline-flex; padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
        .entity-detail-close { color: var(--gold); font-size: 13px; text-decoration: none; }
        .entity-detail-quality, .entity-detail-relations, .entity-detail-sources { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--cream-2); }
        .entity-detail h3 { margin: 0 0 10px; color: var(--dark); font-size: 16px; }
        .entity-detail ul { margin: 0; padding-left: 20px; color: var(--text-muted); line-height: 1.6; }
        .entity-detail-empty { color: var(--text-muted); font-size: 14px; line-height: 1.6; }
        .entity-place-list { display: grid; gap: 10px; }
        .entity-place-card { border: 1px solid var(--cream-2); border-radius: 12px; padding: 13px 14px; }
        .entity-place-name { display: inline-block; color: var(--dark); font-weight: 700; text-decoration: none; }
        .entity-place-name:hover { color: var(--gold); }
        .entity-place-meta, .entity-place-relation, .entity-place-source { margin-top: 5px; color: var(--text-muted); font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
        .entity-place-card .entity-detail-badge { margin-top: 8px; }
        .entity-detail-related { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--cream-2); }
        .entity-graph-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
        .entity-graph-card { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 1px solid var(--cream-2); border-radius: 12px; color: var(--dark); text-decoration: none; }
        .entity-graph-card:hover { border-color: var(--gold); background: var(--gold-pale); }
        .entity-graph-card strong { font-size: 14px; line-height: 1.35; }
        .entity-graph-card span { color: var(--text-muted); font-size: 11px; line-height: 1.4; }

        /* НОВЫЕ КНОПКИ ДЕЙСТВИЙ */
        .holiness-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .holiness-actions a {
            flex: 1;
            text-align: center;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: all var(--transition);
            min-width: 120px;
        }
        .btn-location {
            background: var(--gold-pale);
            color: var(--dark);
            border: 1px solid var(--gold);
        }
        .btn-location:hover {
            background: var(--gold-light);
        }
        .btn-route {
            background: var(--cream-2);
            color: var(--dark);
            border: 1px solid var(--cream-2);
        }
        .btn-route:hover {
            background: var(--gold-pale);
        }

        @media (max-width: 560px) {
            .holiness-card-img { height: 160px; }
            .holiness-name { font-size: 18px; }
            .holiness-actions a { min-width: 80px; font-size: 12px; }
            .entity-detail { padding: 18px; }
            .entity-detail-top { flex-direction: column; gap: 14px; }
            .entity-detail-side { align-items: flex-start; }
        }

        .entity-content-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
        .entity-content-card { display:flex; flex-direction:column; gap:6px; padding:13px 14px; border:1px solid var(--cream-2); border-radius:12px; background:var(--white); color:inherit; text-decoration:none; }
        .entity-content-card:hover { border-color:var(--gold); background:var(--gold-pale); }
        .entity-content-card strong { color:var(--dark); line-height:1.35; }
        .entity-content-card span { color:var(--text-muted); font-size:12px; line-height:1.45; }
    </style>
</head>
<body>
    <div id="nav-container"></div>
    <div id="bottom-nav-container"></div>

    <div class="page-section">
        <div class="breadcrumbs">
            <a href="index.html">Главная</a> &rarr;
            <span>Святыни</span>
        </div>

        <div class="holiness-header">
            <h1>Святые, иконы<br><em>и мощи</em></h1>
            <p>Путеводитель по величайшим святыням православного мира. Жития святых, чудотворные иконы и местонахождение святых мощей.</p>
        </div>

        <section class="entity-detail" id="entityDetail" hidden aria-live="polite">
            <div id="entityDetailContent"></div>
        </section>

        <div class="holiness-search">
            <span class="search-icon">🔍</span>
            <input type="text" id="holinessSearch" placeholder="Поиск по имени, месту, святому...">
        </div>

        <div class="holiness-filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="saint">Святые</button>
            <button class="filter-btn" data-filter="icon">Чудотворные иконы</button>
            <button class="filter-btn" data-filter="relic">Святые мощи</button>
        </div>

        <div class="holiness-grid" id="holinessGrid"></div>
    </div>

    <div id="footer-container"></div>

    <script src="js/data-layer.js"></script>
    <script src="js/content-layer.js"></script>
    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/holiness.js"></script>
</body>
</html>
