<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Каталог православных храмов, монастырей, часовен и других объектов с поиском и фильтрами по регионам, типам и статусам.">
    <title>Каталог храмов и монастырей — Православный Мир</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/catalog.css">
</head>
<body>
    <div id="nav-container"></div>
    <div id="bottom-nav-container"></div>

    <main class="page-section">
        <div class="catalog-shell">
            <div class="breadcrumbs">
                <a href="../index.html">Главная</a> &rarr;
                <span>Каталог храмов</span>
            </div>

            <header class="catalog-header">
                <div>
                    <h1>Храмы и монастыри<br><em>России и СНГ</em></h1>
                    <p>Ищите объекты по названию, посвящению, адресу и региону. Комбинируйте фильтры и открывайте карточку или объект на карте.</p>
                </div>
                <div class="catalog-total" id="catalogTotal" aria-live="polite">
                    <strong>—</strong>
                    объектов в каталоге
                </div>
            </header>

            <section class="discovery-panel" aria-label="Поиск и фильтры каталога">
                <div class="discovery-search-row">
                    <label class="catalog-search-box" for="catalogSearch">
                        <span class="catalog-search-icon" aria-hidden="true" data-ui-icon="compass"></span>
                        <input id="catalogSearch" type="search" autocomplete="off" spellcheck="false" placeholder="Название, святой, адрес, населённый пункт…">
                        <button class="catalog-search-clear" id="catalogSearchClear" type="button" aria-label="Очистить поиск" hidden>×</button>
                    </label>

                    <label>
                        <span class="sr-only">Регион</span>
                        <select class="catalog-control" id="catalogRegion" aria-label="Фильтр по региону">
                            <option value="all">Все регионы</option>
                        </select>
                    </label>

                    <button class="catalog-reset" id="catalogReset" type="button">Сбросить фильтры</button>
                </div>

                <hr class="discovery-divider">

                <div class="discovery-grid">
                    <div class="facet-group">
                        <div class="facet-title">Тип объекта</div>
                        <div class="facet-list" id="catalogTypeFacets" role="group" aria-label="Тип объекта"></div>
                    </div>
                    <div class="facet-group">
                        <div class="facet-title">Статус</div>
                        <div class="facet-list" id="catalogStatusFacets" role="group" aria-label="Статус объекта"></div>
                    </div>
                    <div class="facet-group">
                        <div class="facet-title">Состояние выборки</div>
                        <div class="catalog-summary" id="catalogFacetHint">Фильтры можно комбинировать.</div>
                    </div>
                </div>
            </section>

            <div class="catalog-toolbar">
                <div class="catalog-summary" id="catalogSummary" aria-live="polite">Загрузка каталога…</div>
                <label class="catalog-sort-wrap">
                    <span>Сортировка</span>
                    <select class="catalog-control" id="catalogSort">
                        <option value="relevance">По релевантности</option>
                        <option value="name">По названию</option>
                        <option value="region">По региону</option>
                        <option value="quality">По качеству данных</option>
                    </select>
                </label>
            </div>

            <div class="catalog-grid catalog-grid-loading" id="catalogGrid" aria-busy="true"><div class="catalog-skeleton" aria-hidden="true"></div><div class="catalog-skeleton" aria-hidden="true"></div><div class="catalog-skeleton" aria-hidden="true"></div></div>

            <div class="catalog-load-more" id="catalogLoadMore">
                <button type="button">Показать ещё</button>
                <div class="catalog-count"></div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="../js/config.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/data-layer.js"></script>
    <script src="../js/catalog-discovery.js"></script>
    <script src="../js/catalog.js"></script>
</body>
</html>
