<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Православный календарь — Православный Мир</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/calendar.css">
</head>
<body>
    <div id="nav-container"></div><div id="bottom-nav-container"></div>
    <main class="page-section">
        <div class="breadcrumbs"><a href="index.html">Главная</a> &rarr; <span>Православный календарь</span></div>
        <div class="calendar-wrapper">
            <header class="cal-header"><h1>Православный<br><em>календарь</em></h1><p class="cal-source-note" id="coverageText">Загрузка календаря…</p></header>
            <div id="calendarError" class="cal-error" hidden></div>
            <div class="cal-today-wrapper"><div class="cal-today-indicator">Сегодня: <strong id="todayDateText">—</strong></div><div class="cal-today-event" id="todayEventText">—</div></div>
            <div class="cal-search"><input type="text" id="dateSearch" aria-label="Найти день календаря" placeholder="25 июня 2026, 25.06, 25/06" inputmode="text"><button type="button" id="dateSearchBtn">Найти</button></div>
            <div class="cal-nav"><button class="cal-nav-btn" id="prevMonth" type="button">‹ Назад</button><span class="cal-month" id="currentMonthLabel">—</span><button class="cal-nav-btn" id="nextMonth" type="button">Вперёд ›</button></div>
            <div class="cal-legend"><span>золотой — праздник</span><span>точка — память</span><span>линия — период поста</span><span>кольцо — событие</span></div>
            <div class="cal-grid" id="calendarGrid"></div>
            <section class="cal-details" id="dayDetails" aria-live="polite"><div class="cal-details-title" id="selectedDayTitle">Выберите день</div><div class="cal-details-sub" id="selectedDaySub"></div><div class="cal-records" id="selectedDayRecords"></div><a class="cal-day-link" id="canonicalDayLink" href="#" hidden>Подробнее об этом дне →</a></section>
        </div>
    </main>
    <div id="footer-container"></div>
    <script src="js/config.js"></script><script src="js/components.js"></script><script src="js/liturgical-layer.js"></script><script src="js/event-layer.js"></script><script src="js/food-layer.js"></script><script src="js/calendar.js"></script>
</body>
</html>
